name: Package Toolkit

on:
  push:
    paths:
      - package.json
      - package-lock.json
      - resources/**
      - README.md
      - CHANGELOG.md
      - .github/instructions/**
      - .github/agents/**
      - .github/prompts/**
      - .github/skills/**
      - .github/copilot-script-catalogue.md
      - docs/run-books/vsix-packaging.md
      - scripts/discover-copilot-artifacts.cjs
      - scripts/sync-copilot-manifest.cjs
      - scripts/verify-vsix-boundary.cjs
      - scripts/verify-copilot-contracts.cjs
      - scripts/verify-vsix-packaging-guide.cjs
      - .github/workflows/package.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - resources/**
      - README.md
      - CHANGELOG.md
      - .github/instructions/**
      - .github/agents/**
      - .github/prompts/**
      - .github/skills/**
      - .github/copilot-script-catalogue.md
      - docs/run-books/vsix-packaging.md
      - scripts/discover-copilot-artifacts.cjs
      - scripts/sync-copilot-manifest.cjs
      - scripts/verify-vsix-boundary.cjs
      - scripts/verify-copilot-contracts.cjs
      - scripts/verify-vsix-packaging-guide.cjs
      - .github/workflows/package.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out Toolkit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Copilot customization contracts
        run: npm run verify-copilot-contracts
      - name: Verify VSIX packaging guide
        run: npm run verify-vsix-packaging-guide
      - name: Package Toolkit
        run: npm run package
      - name: Verify package boundary
        run: npm run verify-package
